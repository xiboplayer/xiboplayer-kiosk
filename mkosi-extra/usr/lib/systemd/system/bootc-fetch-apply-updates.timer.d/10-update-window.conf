# bootc's own timer fires 1 h after boot and then daily at a random hour,
# and its service runs `bootc update --apply`, which REBOOTS the box when
# a new image was staged. Unconstrained, that is a signage player rebooting
# in the middle of the trading day. Pin the apply to a quiet hour instead;
# the hour is the operator's to change. Persistent stays off on purpose:
# with it on, a box that was powered down over the window catches up the
# moment it boots, which is the mid-day reboot again.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=1h
Persistent=false
