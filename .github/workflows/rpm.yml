name: Build RPM

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  rpm:
    uses: xiboplayer/.github/.github/workflows/build-rpm.yml@2f9f0f369ade9accb7afb1577a61d5a38e2883fc  # main
    with:
      package-name: xiboplayer-kiosk
      rpm-spec: 'rpm/xiboplayer-kiosk.spec'
      fedora-matrix: '["44", "45"]'
      source-tarball: 'full'
      gpg-sign: true
      publish-to-repo: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
